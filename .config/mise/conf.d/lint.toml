[tasks.lint]
description = "Run linter (ruff) and apply safe and unsafe fixes"
run = 'ruff check src/ tests/ --fix --unsafe-fixes'

[tasks.lint-check]
description = "Run linter (ruff) without applying fixes"
run = 'ruff check src/ tests/'

[tasks.typecheck]
description = "Run type checker (ty)"
run = 'ty check src/ tests/'

[tasks.spell]
description = "Run spell checker (codespell)"
run = "codespell src/ tests/"
