[tasks.test]
description = "Run tests with coverage"
run = "uv run pytest --cov=teddi_tool"
sources = ["src/**/*.py", "tests/**/*.py"]
outputs = ["htmlcov/", ".coverage"]

[tasks.all]
description = "Run all quality checks"
depends = [
  "test",
  "lint",
  "spell",
  "format",
  "format-md",
  "docs",
]

[tasks.release-notes]
description = "Generate release notes for the latest tag with an OpenAI-compatible endpoint"
run = "uv run --with httpx2 python scripts/release_notes.py"

[tasks.clean]
description = "Clean build artifacts"
run = ["rm -rf build dist *.egg-info .pytest_cache .coverage htmlcov docs/_build"]
