[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teddi-mcp"
version = "0.1.0"
description = "FastMCP 3.0 server for ETSI TEDDI (Terms and Definitions Database Interactive) search integration"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jan Reimes", email = "jan.reimes@head-acoustics.com" }
]
requires-python = ">=3.13"

dependencies = [
    "fastmcp>=0.1.0",
    "pydantic>=2.0",
    "httpx>=0.25.0",
    "hishel>=0.28.0",
    "anysqlite>=0.0.5",
    "beautifulsoup4>=4.12.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "ison-py>=1.0.2",
    "toon-format>=0.9.0b1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "ty>=0.1.0",
    "undersort>=0.1.5",
]

[project.scripts]
teddi-mcp = "src.teddi_mcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/teddi_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["teddi_mcp"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.undersort]
order = ["public", "protected", "private"]
method_type_order = ["instance", "class", "static"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
