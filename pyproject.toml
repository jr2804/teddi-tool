[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "teddi-tool"
dynamic = ["version"]
description = "CLI and FastMCP server for the ETSI TEDDI terminology database"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "Jan Reimes", email = "jan.reimes@head-acoustics.com" }
]
keywords = ["etsi", "teddi", "terminology", "standards", "mcp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "anysqlite>=0.0.5",
    "beautifulsoup4>=4.12.0",
    "cyclopts>=5.0.0",
    "fastmcp>=3.0",
    "hishel>=2.0.0",
    "httpx>=0.27",
    "ison-py>=1.0.2",
    "pydantic>=2.0",
    "rich>=13.0.0",
    "toon-format>=0.9.0b1",
]

[project.urls]
Homepage = "https://github.com/jr2804/teddi-tool"
Repository = "https://github.com/jr2804/teddi-tool"
Issues = "https://github.com/jr2804/teddi-tool/issues"
Changelog = "https://github.com/jr2804/teddi-tool/releases"
Documentation = "https://jr2804.github.io/teddi-tool/"

[project.scripts]
teddi = "teddi_tool.cli.app:main"
teddi-cli = "teddi_tool.cli.app:main"
teddi-mcp = "teddi_tool.server:main"
teddi-tool = "teddi_tool.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0.0",
    "ruff",
    "ty",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.29",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teddi_tool"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
vcs = "git"
style = "semver"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["teddi_tool"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css,uv.lock"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te,ison,toon,searchin,searchpattern,technicalbody,alloccurrences,startingwith,endingwith"
ignore-regex = "https?://|\b[A-Z]+\b"
